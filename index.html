<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#dff4ef">
<meta name="description" content="氣球大頭症：學習歷程群島 3D 沉浸探索、動態島嶼規模、海洋生態與成長角色卡">
<title>學習歷程群島｜氣球大頭症（3D 沉浸探索版）</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #1e3545;
  --muted: #5c7280;
  --mint: #dff4ed;
  --teal: #2d8a78;
  --teal-dark: #1f685a;
  --gold: #e8b85c;
  --line: #d6e8e2;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Noto Sans TC", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: #8fcfda;
}

/* Fullscreen 3D Viewport */
.app-shell {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Top Floating Glass Header */
.top-nav {
  position: absolute;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 40;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid rgba(255, 255, 255, 0.9);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(24, 62, 68, 0.12);
  padding: 8px 14px;
  pointer-events: auto;
}

.hud-chip {
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  color: #2c5263;
  background: #eff8f5;
  border: 1px solid #cce6dd;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.hud-chip:hover {
  background: #def3ec;
  border-color: #8fd0bc;
  transform: translateY(-1px);
}
.hud-chip.active {
  background: linear-gradient(135deg, #2d8a78, #43a893);
  color: #fff;
  border-color: #247060;
  box-shadow: 0 4px 12px rgba(45, 138, 120, 0.28);
}

/* 3D Canvas Stage */
.stage-wrap {
  position: relative;
  flex: 1;
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #bce9e8, #8fcfda);
  overflow: hidden;
}

#world {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: grab;
}
#world:active { cursor: grabbing; }

/* Projected 2D Labels on 3D Canvas */
#island-markers {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 15;
}
.island-marker {
  position: absolute;
  transform: translate(-50%, -100%);
  pointer-events: auto;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(8px);
  border: 1.5px solid #cde5de;
  border-radius: 16px;
  padding: 5px 11px;
  font-size: 11.5px;
  font-weight: 800;
  color: #1f4252;
  box-shadow: 0 6px 18px rgba(20, 56, 52, 0.18);
  cursor: pointer;
  transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
  white-space: nowrap;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  user-select: none;
}
.island-marker:hover {
  transform: translate(-50%, -106%) scale(1.05);
  background: #ffffff;
  border-color: #3a9c87;
  box-shadow: 0 8px 22px rgba(45, 138, 120, 0.32);
}
.island-marker.active {
  background: linear-gradient(135deg, #257c6b, #3fa38e);
  color: #ffffff;
  border-color: #ffffff;
  box-shadow: 0 8px 24px rgba(37, 124, 107, 0.5);
}
.island-marker .marker-top {
  display: flex;
  align-items: center;
  gap: 5px;
}
.island-marker .size-tag {
  font-size: 9.5px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
  background: rgba(45, 138, 120, 0.12);
  color: #2b7a69;
}
.island-marker.active .size-tag {
  background: rgba(255, 255, 255, 0.24);
  color: #fff;
}
.island-marker .check-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  font-size: 9.5px;
  background: #dff4ec;
  color: #216e5e;
}
.island-marker.active .check-dot {
  background: rgba(255, 255, 255, 0.28);
  color: #fff;
}

/* Bottom Floating Controls & Island Dock */
.bottom-dock {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  max-width: 96vw;
  pointer-events: none;
}

.dock-row {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(14px);
  border: 1.5px solid rgba(255, 255, 255, 0.92);
  box-shadow: 0 10px 28px rgba(22, 58, 64, 0.16);
  overflow-x: auto;
  max-width: 95vw;
}

.dock-island-btn {
  border: 1.5px solid #d5e8e1;
  background: #ffffff;
  color: #274a5a;
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.2s;
}
.dock-island-btn:hover {
  border-color: #7cc4b0;
  background: #f2fbf8;
  transform: translateY(-1px);
}
.dock-island-btn.active {
  background: linear-gradient(135deg, #2b8573, #42a690);
  color: #fff;
  border-color: #216b5c;
  box-shadow: 0 4px 12px rgba(43, 133, 115, 0.3);
}

/* Slide-Over Island Interactive Drawer (Appears ONLY when an island is clicked) */
.island-drawer {
  position: absolute;
  top: 76px;
  right: 16px;
  bottom: 84px;
  width: min(560px, calc(100vw - 24px));
  z-index: 50;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 2px solid rgba(255, 255, 255, 0.95);
  border-radius: 26px;
  box-shadow: 0 24px 60px rgba(18, 52, 58, 0.26);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateX(110%);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
}
.island-drawer.open {
  transform: translateX(0);
  opacity: 1;
  pointer-events: auto;
}

.drawer-header {
  padding: 16px 20px 12px;
  background: linear-gradient(135deg, #dff5ec 0%, #edf2ff 55%, #fff3d9 100%);
  border-bottom: 1px solid #d5e8e1;
}

.drawer-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 8px 16px;
  background: #f3faf7;
  border-bottom: 1px solid #dcebe5;
}
.drawer-tab {
  border: 1.5px solid #d4e6df;
  background: #ffffff;
  color: #3d5d6c;
  border-radius: 12px;
  padding: 8px 6px;
  font-size: 12.5px;
  font-weight: 800;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}
.drawer-tab:hover {
  background: #eaf7f2;
  border-color: #8cc9b6;
}
.drawer-tab.active {
  background: linear-gradient(135deg, #2d8a78, #43a691);
  color: #ffffff;
  border-color: #247061;
  box-shadow: 0 4px 12px rgba(45, 138, 120, 0.24);
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px 24px;
}

/* Reusable Buttons & UI Elements */
.btn {
  border: 1px solid #cfe2dc;
  background: #ffffff;
  color: #294c5e;
  border-radius: 12px;
  padding: 7px 13px;
  font-size: 12.5px;
  font-weight: 800;
  min-height: 36px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  box-shadow: 0 2px 0 #d5e5df;
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  user-select: none;
}
.btn:hover:not(:disabled) {
  transform: translateY(-1px);
  background: #f6fcfa;
  border-color: #9fd0c0;
}
.btn:active:not(:disabled) {
  transform: translateY(1px);
}
.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.btn-primary {
  background: linear-gradient(135deg, #2d8a78, #44a692);
  color: #ffffff;
  border-color: #257566;
  box-shadow: 0 2px 0 #1c5c50;
}
.btn-primary:hover:not(:disabled) {
  background: linear-gradient(135deg, #267969, #3b9885);
  color: #ffffff;
}

.kicker {
  font-size: 10.5px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #377d6e;
  text-transform: uppercase;
}

/* Rooms & Reflection inside Drawer */
.rooms-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 12px;
}
.room-card {
  background: #ffffff;
  border: 1.5px solid #dceae4;
  border-radius: 14px;
  padding: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
}
.room-card:hover {
  transform: translateY(-2px);
  border-color: #7ec4ae;
}
.room-card.selected-room {
  border: 2px solid #359680;
  background: #ecfaf3;
}
.room-card .emoji { font-size: 23px; }
.room-card strong {
  display: block;
  font-size: 12.5px;
  margin: 4px 0 2px;
  color: #1f3c4c;
}
.room-card span {
  font-size: 11px;
  line-height: 1.5;
  color: #677b86;
  display: block;
}
.room-note-indicator {
  position: absolute;
  top: 6px;
  right: 6px;
  font-size: 9.5px;
  background: #fff3cd;
  color: #856404;
  border: 1px solid #ffe69c;
  border-radius: 99px;
  padding: 1px 5px;
  font-weight: 800;
}

.room-detail-drawer {
  background: #f8fcfb;
  border: 1.5px solid #cbe3da;
  border-radius: 15px;
  padding: 13px;
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.75;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #daf0e8;
  color: #21695a;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 10px;
  margin: 4px 4px 0 0;
}

.causal-box {
  border-left: 3.5px solid #e6b85c;
  background: #f5fbf8;
  padding: 8px 12px;
  border-radius: 0 10px 10px 0;
  font-size: 12.5px;
  line-height: 1.7;
  color: #465f6d;
  margin-top: 10px;
}

/* Choice Option Styles */
.choice-option {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  border: 1.5px solid #dbe8e3;
  background: #ffffff;
  border-radius: 14px;
  padding: 12px;
  margin-top: 8px;
  cursor: pointer;
  line-height: 1.65;
  font-size: 13.5px;
  transition: all 0.18s ease;
}
.choice-option:hover {
  transform: translateX(3px);
  border-color: #84c6b1;
}
.choice-option input {
  margin-top: 4px;
  accent-color: #2d8a78;
  width: 16px;
  height: 16px;
}
.choice-option:has(input:checked) {
  border: 2px solid #359680;
  background: #ecfaf3;
}

/* Lab Stages inside Drawer */
.balloon-stage {
  height: 195px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 78%, #daf2e6, #eff8ff 72%);
  border: 1px solid #d8ece4;
  border-radius: 16px;
  margin: 8px 0 12px;
}
.interactive-balloon {
  --balloon-size: 86px;
  width: var(--balloon-size);
  height: calc(var(--balloon-size) * 1.14);
  border-radius: 52% 48% 48% 52% / 45% 45% 55% 55%;
  background:
    radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.75) 0 6%, transparent 26%),
    radial-gradient(circle at 35% 25%, #ffd2df, #f0739c 62%, #d14474);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: absolute;
  top: 18px;
  z-index: 2;
  box-shadow: inset -8px -10px 16px rgba(140, 35, 72, 0.22), 0 10px 24px rgba(215, 95, 135, 0.32);
  transition: width 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), height 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.38s ease;
}
.interactive-balloon.danger-wobble {
  animation: balloonShake 0.45s infinite alternate;
}
@keyframes balloonShake {
  0% { transform: translateY(-14px) rotate(-4deg) scale(1.02); }
  100% { transform: translateY(-18px) rotate(4deg) scale(1.05); }
}
.interactive-balloon::after {
  content: "";
  position: absolute;
  bottom: -8px;
  left: calc(50% - 7px);
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-top: 10px solid #d14474;
}
.balloon-face { font-size: 20px; line-height: 1; margin-bottom: 2px; }
.interactive-balloon span.balloon-label {
  font-size: 10.5px;
  font-weight: 900;
  color: #6b1d39;
  text-align: center;
}
.balloon-thought {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid #d9e8e3;
  border-radius: 12px;
  padding: 4px 9px;
  font-size: 11px;
  font-weight: 700;
  color: #3d5a68;
  z-index: 3;
}
.balloon-string {
  position: absolute;
  top: 112px;
  height: 65px;
  border-left: 1.5px dashed #b47a89;
  z-index: 1;
}
.balloon-shadow {
  position: absolute;
  bottom: 12px;
  width: 84px;
  height: 12px;
  background: rgba(135, 190, 175, 0.45);
  border-radius: 50%;
  filter: blur(4px);
}

.meter {
  height: 9px;
  background: #e4eeeb;
  border-radius: 99px;
  overflow: hidden;
  margin: 8px 0;
}
.meter > span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #5ec29f, #f0b865, #ea678d);
  border-radius: 99px;
  transition: width 0.35s ease;
}

.response-options {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.response-option {
  border: 1.5px solid #dce8e4;
  background: #ffffff;
  border-radius: 14px;
  padding: 10px 6px;
  cursor: pointer;
  color: #294654;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: all 0.18s ease;
}
.response-option:hover {
  transform: translateY(-2px);
  border-color: #82c5b0;
}
.response-option.chosen {
  border: 2px solid #359680;
  background: #ecfaf3;
}
.response-option span.icon { font-size: 24px; }
.response-option b { font-size: 11.5px; }
.response-option small { font-size: 10px; color: #6d8089; text-align: center; }

.crown-stage {
  height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(ellipse, #fff4cc, #f9f6ff 72%);
  border: 1px solid #e8e2d5;
  border-radius: 16px;
  margin: 8px 0 10px;
}
.interactive-crown {
  font-size: 64px;
  filter: drop-shadow(0 8px 6px rgba(140, 116, 53, 0.25));
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease;
}
.crown-crack {
  position: absolute;
  right: 34%;
  top: 24%;
  font-size: 26px;
  color: #d14949;
  opacity: 0;
  transition: all 0.35s ease;
}

/* Badges & Character Card */
.badge-shelf {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 10px 0;
}
.reward-badge {
  display: flex;
  gap: 8px;
  align-items: center;
  border: 1px solid #dce8e3;
  background: #f9fbfa;
  border-radius: 14px;
  padding: 9px 11px;
  font-size: 12px;
  font-weight: 700;
  color: #7c8d96;
  opacity: 0.65;
  transition: all 0.25s ease;
}
.reward-badge.earned {
  opacity: 1;
  background: linear-gradient(135deg, #fff9e2, #fff1c2);
  border-color: #e4c467;
  color: #7a5818;
  box-shadow: 0 4px 12px rgba(230, 195, 95, 0.25);
}

.character-card-wrap {
  perspective: 900px;
  margin: 8px 0 10px;
}
.character-card {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  padding: 16px;
  text-align: center;
  background:
    radial-gradient(circle at 50% 0%, #fff7db, transparent 52%),
    linear-gradient(145deg, #d9f4e6 0%, #e7ecff 58%, #fff2d6 100%);
  border: 2px solid #c9e3d9;
  box-shadow: 0 12px 28px rgba(42, 92, 82, 0.14);
  transform-style: preserve-3d;
  transition: transform 0.15s ease-out;
}
.character-avatar { font-size: 50px; margin: 2px auto; }
.character-stats {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
}
.character-stats span {
  font-size: 10.5px;
  font-weight: 800;
  border-radius: 99px;
  padding: 4px 9px;
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid rgba(190, 222, 210, 0.8);
  color: #356357;
}

/* Floating Toast & Modal */
.floating-toast {
  position: fixed;
  top: 76px;
  left: 50%;
  transform: translateX(-50%) translateY(-10px);
  z-index: 100;
  background: rgba(24, 62, 56, 0.95);
  backdrop-filter: blur(8px);
  color: #fff;
  padding: 10px 18px;
  border-radius: 999px;
  box-shadow: 0 10px 28px rgba(20, 55, 50, 0.35);
  font-size: 12.5px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  max-width: 92vw;
  text-align: center;
}
.floating-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 120;
  background: rgba(20, 42, 52, 0.45);
  backdrop-filter: blur(5px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal-card {
  background: #ffffff;
  border: 1px solid #d5e8e1;
  border-radius: 22px;
  max-width: 440px;
  width: 100%;
  padding: 22px;
  box-shadow: 0 24px 60px rgba(20, 48, 58, 0.25);
}

@media (max-width: 680px) {
  .island-drawer {
    top: auto;
    right: 8px;
    left: 8px;
    bottom: 74px;
    width: auto;
    height: 72vh;
    transform: translateY(115%);
  }
  .island-drawer.open {
    transform: translateY(0);
  }
  .rooms-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app-shell">
  <!-- Top Floating Bar -->
  <header class="top-nav" aria-label="群島導覽與生態狀態列">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <span class="text-lg">🏝️</span>
        <div>
          <h1 class="text-sm sm:text-base font-black text-slate-800 m-0 leading-tight">
            學習歷程群島｜氣球大頭症
          </h1>
          <p class="text-[11px] text-slate-500 m-0 hidden md:block">
            點選 3D 島嶼即可開啟該島專屬「故事房間、抉擇與互動實驗室」· 島嶼規模隨內容與探索成長
          </p>
        </div>
      </div>

class SoundFX {
  constructor() {
    this.enabled = true;
    this.ctx = null;
  }
  init() {
    if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playTone(freq = 523.25, duration = 0.14, type = 'sine', gainVal = 0.08, slideFreq = null) {
    if (!this.enabled) return;
    try {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, now + duration);
      gain.gain.setValueAtTime(gainVal, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + duration);
    } catch (e) {}
  }
  islandSelect(idx) {
    const scale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0];
    const base = scale[idx % scale.length];
    this.playTone(base, 0.16, 'triangle', 0.09);
    setTimeout(() => this.playTone(base * 1.25, 0.22, 'sine', 0.07), 70);
  }
  click() { this.playTone(660, 0.07, 'sine', 0.05, 880); }
  inflate() { this.playTone(280, 0.22, 'sine', 0.09, 480); }
  deflate() { this.playTone(520, 0.25, 'triangle', 0.08, 260); }
  horn() {
    this.playTone(146.83, 0.45, 'sawtooth', 0.06, 142);
    setTimeout(() => this.playTone(185.0, 0.55, 'triangle', 0.06), 120);
  }
  fanfare() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 0.22, 'triangle', 0.09), i * 85);
    });
  }
}
const sfx = new SoundFX();

document.querySelector('#sound-toggle').addEventListener('click', (e) => {

});

function toast(message) {
  let t = document.querySelector('.floating-toast');
  if (!t) {
    t = document.createElement('div');
    t.className = 'floating-toast';
    document.body.appendChild(t);
  }
  t.textContent = message;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

function copyTextSafe(text, successMsg = '📋 已複製到剪貼簿！') {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast(successMsg);
    sfx.fanfare();
  } catch (e) {
    toast('複製失敗，請手動選取複製');
  }
  ta.remove();
}

function saveJourney() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      chosen,
      visitedIslands: [...visitedIslands],
      roomNotes,
      challengeIndex,
      challengeCompleted,
      questCount,
      travelerName,
      travelerMotto,
      storyState,
      updatedAt: new Date().toISOString()
    }));
  } catch (e) {}
}

function loadJourney() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('learning-archipelago-v7-flagship');
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && Array.isArray(saved.chosen) && saved.chosen.length === 5) {
      saved.chosen.forEach((v, i) => {
        if (v === null || (Number.isInteger(v) && v >= 0 && v < 3)) chosen[i] = v;
      });
    }
    if (Array.isArray(saved.visitedIslands)) {
      saved.visitedIslands.forEach(idx => visitedIslands.add(idx));
    }
    if (saved.roomNotes && typeof saved.roomNotes === 'object') {
      roomNotes = saved.roomNotes;
    }
    if (Number.isInteger(saved.challengeIndex)) {
      challengeIndex = ((saved.challengeIndex % challengeList.length) + challengeList.length) % challengeList.length;
    }
    challengeCompleted = !!saved.challengeCompleted;
    questCount = Number(saved.questCount) || (challengeCompleted ? 1 : 0);
    if (typeof saved.travelerName === 'string') travelerName = saved.travelerName;
    if (typeof saved.travelerMotto === 'string') travelerMotto = saved.travelerMotto;
    if (saved.storyState && typeof saved.storyState === 'object') {
      Object.assign(storyState, saved.storyState);
    }
  } catch (e) {}
}

// Calculate dynamic scale of each island based on base content + user's added content on that island!
function getIslandDynamicScale(idx) {
  const base = data[idx].baseScale;
  let bonus = 0;
  // Each room note on this island adds +0.04 scale
  for (let r = 0; r < 3; r++) {
    if (roomNotes[`${idx}-${r}`] && roomNotes[`${idx}-${r}`].trim()) {
      bonus += 0.045;
    }
  }
  // Completing this island's choice station adds +0.06 scale
  if (idx < 5 && chosen[idx] !== null) bonus += 0.06;
  if (idx === 5) {
    const answeredCount = chosen.filter(v => v !== null).length;
    bonus += answeredCount * 0.025;
  }
  // Completing this island's lab activity adds +0.05 scale
  if (idx === 0 && storyState.balloonTouched) bonus += 0.05;
  if (idx === 1 && storyState.response) bonus += 0.05;
  if (idx === 2 && (challengeCompleted || questCount > 0)) bonus += 0.05;
  if (idx === 3 && storyState.motive) bonus += 0.05;

  return Number((base + bonus).toFixed(2));
}

function getIslandContentCount(idx) {
  let count = data[idx].contentItemsCount;
  for (let r = 0; r < 3; r++) {
    if (roomNotes[`${idx}-${r}`] && roomNotes[`${idx}-${r}`].trim()) count += 1;
  }
  if (idx < 5 && chosen[idx] !== null) count += 1;
  if (idx === 0 && storyState.balloonTouched) count += 1;
  if (idx === 1 && storyState.response) count += 1;
  if (idx === 2 && questCount > 0) count += questCount;
  if (idx === 3 && storyState.motive) count += 1;
  return count;
}

function mat(color, roughness = 0.85, emissive = 0x000000, emissiveIntensity = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, flatShading: true, emissive, emissiveIntensity });
}

function addMesh(g, geo, m, x, y, z, cast = true) {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, z);
  o.castShadow = cast;
  o.receiveShadow = true;
  g.add(o);
  return o;
}

function tree(g, x, z, s = 1) {
  addMesh(g, new THREE.CylinderGeometry(0.07 * s, 0.12 * s, 0.55 * s, 5), mat(0x936b4e), x, 0.25 * s, z);
  addMesh(g, new THREE.IcosahedronGeometry(0.43 * s, 0), mat(0x559b76), x, 0.65 * s, z);
  addMesh(g, new THREE.IcosahedronGeometry(0.29 * s, 0), mat(0x82bd85), x, 0.94 * s, z);
}

function house(g, x, z, s = 1, wall = 0xffe5bd, roof = 0xd78d67) {
  addMesh(g, new THREE.BoxGeometry(0.8 * s, 0.62 * s, 0.68 * s), mat(wall), x, 0.48 * s, z);
  const r = addMesh(g, new THREE.ConeGeometry(0.68 * s, 0.5 * s, 4), mat(roof), x, 0.99 * s, z);
  r.rotation.y = Math.PI / 4;
  addMesh(g, new THREE.BoxGeometry(0.15 * s, 0.29 * s, 0.04 * s), mat(0x517b82), x + 0.16 * s, 0.34 * s, z + 0.36 * s, false);
  addMesh(g, new THREE.BoxGeometry(0.15 * s, 0.16 * s, 0.04 * s), mat(0xfff0b8, 0.4, 0xffca58, 0.45), x - 0.19 * s, 0.54 * s, z + 0.36 * s, false);

function makeIsland(d, i) {
  const g = new THREE.Group();
  const x = islandXPositions[i];
  const z = Math.sin(i * 0.95) * 1.65;
  g.position.set(x, 0, z);
  g.userData.index = i;
  const initScale = getIslandDynamicScale(i);
  g.scale.set(initScale, initScale, initScale);
  g.userData.targetScale = initScale;
  world.add(g);

  // Island Base & Cliffs
  addMesh(g, new THREE.CylinderGeometry(1.98, 1.32, 0.68, 7, 1), mat(0x9a865e), 0, -0.14, 0);
  addMesh(g, new THREE.CylinderGeometry(1.92, 1.72, 0.25, 7, 1), mat(d.color), 0, 0.22, 0);
  const hill = addMesh(g, new THREE.ConeGeometry(1.22, 0.92, 5), mat(d.color), 0, 0.65, -0.1);
  hill.rotation.y = 0.3;

  // Shoreline & Ring inside Island Group so it scales together!
  const shoreline = new THREE.Mesh(new THREE.TorusGeometry(1.88, 0.048, 7, 42), trimMat);
  shoreline.rotation.x = Math.PI / 2;
  shoreline.position.set(0, 0.31, 0);
  g.add(shoreline);

  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.16, 0.025, 6, 48), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 }));
  ring.rotation.x = Math.PI / 2;
  ring.position.set(0, 0.38, 0);
  g.add(ring);

  // More trees/houses/flowers on islands with more content!
  tree(g, -1.02, -0.25, 0.86);
  tree(g, 1.15, -0.2, 0.74);
  if (d.contentItemsCount >= 11) tree(g, -0.75, -0.95, 0.68);
  if (d.contentItemsCount >= 15) tree(g, 0.85, 0.78, 0.72);

  house(g, -0.35, 0.45, 0.85, 0xffebc8, 0xd88e67);
  house(g, 0.55, -0.65, 0.66, 0xf7d8a4, 0xb87961);
  if (d.contentItemsCount >= 14) {
    house(g, -0.95, 0.55, 0.58, 0xe8f4ea, 0x5d9b84);
  }

  const numFlowers = 5 + Math.floor(d.contentItemsCount / 2);
  for (let j = 0; j < numFlowers; j++) {
    const a = (j / numFlowers) * Math.PI * 2 + i;
    const fx = Math.cos(a) * 1.48;
    const fz = Math.sin(a) * 1.48;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.025, 0.16, 4), mat(0x568e63));
    stem.position.set(fx, 0.48, fz);
    g.add(stem);
    const bloom = new THREE.Mesh(new THREE.SphereGeometry(0.085, 7, 5), flowerMats[(i + j) % flowerMats.length]);
    bloom.position.set(fx, 0.58, fz);
    bloom.scale.set(1, 0.75, 1);
    g.add(bloom);
  }

  // Flagpole
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.035, 0.75, 5), mat(0x8c7258));
  pole.position.set(0.2, 1.22, -1.1);
  g.add(pole);
  const flag = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.34, 3), new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.6 }));
  flag.rotation.z = -Math.PI / 2;
  flag.position.set(0.39, 1.36, -1.1);
  g.add(flag);

  // Crystal
  const crystal = addMesh(g, new THREE.OctahedronGeometry(0.22, 0), crystalMat, (i % 2) ? 1.65 : -1.65, 0.42, 0.4);
  crystal.rotation.set(0.4, 0.7, 0.2);

  // Island-Specific Landmarks
  if (i === 0) {
    const balloonGroup = new THREE.Group();
    balloonGroup.position.set(-0.8, 1.5, 0.4);
    const ball = addMesh(balloonGroup, new THREE.SphereGeometry(0.35, 12, 10), mat(0xef789e, 0.4, 0xd64d7a, 0.15), 0, 0, 0);
    ball.scale.set(1, 1.18, 1);
    addMesh(balloonGroup, new THREE.CylinderGeometry(0.012, 0.012, 0.7, 4), mat(0xffffff), 0, -0.55, 0, false);
    g.add(balloonGroup);
    landmarkBalloonMesh = ball;
  }
  if (i === 1) {
    for (let k = 0; k < 4; k++) {
      addMesh(g, new THREE.CylinderGeometry(0.22, 0.25, 0.04, 7), mat(0x6e5540, 0.3), -0.65 + k * 0.42, 0.35, 0.92);
    }
    const stormCloud = new THREE.Group();
    stormCloud.position.set(-0.1, 2.25, 0.6);
    for (let c = 0; c < 3; c++) {
      addMesh(stormCloud, new THREE.SphereGeometry(0.28 + (c === 1 ? 0.08 : 0), 7, 6), mat(0x7c909e), (c - 1) * 0.26, c === 1 ? 0.08 : 0, 0);
    }
    g.add(stormCloud);
    for (let r = 0; r < 6; r++) {
      const drop = addMesh(g, new THREE.CylinderGeometry(0.015, 0.015, 0.16, 4), mat(0x63b8ee, 0.3, 0x63b8ee, 0.3), -0.35 + r * 0.14, 1.4 + (r % 3) * 0.25, 0.6, false);
      drop.userData.rainSeed = r * 1.1;
      rainDrops.push(drop);
    }
  }
  if (i === 2) {
    addMesh(g, new THREE.BoxGeometry(0.42, 0.65, 0.16), mat(0x4f93b8, 0.4, 0x2b6585, 0.2), 0, 1.18, 0.5);
    addMesh(g, new THREE.BoxGeometry(0.12, 0.45, 0.19), mat(0xffdf80, 0.3, 0xffc83b, 0.4), 0, 1.18, 0.5);
    addMesh(g, new THREE.BoxGeometry(0.3, 0.12, 0.19), mat(0xffdf80, 0.3, 0xffc83b, 0.4), 0, 1.24, 0.5);
    landmarkShieldRing = addMesh(g, new THREE.TorusGeometry(0.55, 0.03, 6, 24), mat(0xffdf80, 0.3, 0xffc83b, 0.5), 0, 1.18, 0.5, false);
  }
  if (i === 3) {
    landmarkCrownGroup = new THREE.Group();
    landmarkCrownGroup.position.set(0, 1.42, 0.35);
    const c = addMesh(landmarkCrownGroup, new THREE.TorusGeometry(0.32, 0.08, 6, 12), mat(0xf2c14e, 0.35, 0xd99b26, 0.25), 0, 0, 0);
    c.rotation.x = Math.PI / 2;

const tempVec = new THREE.Vector3();
function updateMarkers() {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  for (let i = 0; i < islandGroups.length; i++) {
    const g = islandGroups[i];
    const s = g.scale.y;
    tempVec.set(g.position.x, g.position.y + 2.35 * s, g.position.z);
    tempVec.project(camera);
    const x = (tempVec.x * 0.5 + 0.5) * width;
    const y = (-(tempVec.y * 0.5) + 0.5) * height;
    const marker = markerNodes[i];
    if (tempVec.z > 1 || x < -60 || x > width + 60 || y < 55 || y > height - 60) {
      marker.style.opacity = '0';
      marker.style.pointerEvents = 'none';
    } else {
      marker.style.opacity = '1';
      marker.style.pointerEvents = 'auto';
      marker.style.left = `${x}px`;
      marker.style.top = `${y}px`;
    }
  }
}

const seaPosAttr = seaGeo.attributes.position;
const seaBaseZ = new Float32Array(seaPosAttr.count);
for (let i = 0; i < seaPosAttr.count; i++) {
  seaBaseZ[i] = seaPosAttr.getZ(i);
}

function render() {
  requestAnimationFrame(render);
  const t = performance.now();

  // 1. Ocean Waves
  for (let i = 0; i < seaPosAttr.count; i++) {
    const vx = seaPosAttr.getX(i);
    const vy = seaPosAttr.getY(i);
    const wave = Math.sin(vx * 0.32 + t * 0.002) * 0.065 + Math.cos(vy * 0.32 + t * 0.0018) * 0.055;
    seaPosAttr.setZ(i, seaBaseZ[i] + wave);
  }
  seaPosAttr.needsUpdate = true;

  // 2. Smoothly animate island dynamic scales based on content
  islandGroups.forEach(g => {
    const ts = g.userData.targetScale || 1;
    g.scale.x = THREE.MathUtils.lerp(g.scale.x, ts, 0.06);
    g.scale.y = THREE.MathUtils.lerp(g.scale.y, ts, 0.06);
    g.scale.z = THREE.MathUtils.lerp(g.scale.z, ts, 0.06);
  });

  // 3. Clouds & Island Landmarks
  deco.children.forEach(o => {
    if (o.userData.cloud) {
      o.position.x += o.userData.speed;
      if (o.position.x > 22) o.position.x = -22;
    }
  });
  rainDrops.forEach(drop => {
    drop.position.y -= 0.025;
    if (drop.position.y < 0.45) drop.position.y = 1.95;
  });
  if (landmarkShieldRing) landmarkShieldRing.rotation.z = t * 0.0012;
  if (landmarkCrownGroup) landmarkCrownGroup.rotation.y = t * 0.0015;

  // 4. Seagulls Flapping & Circling
  seagulls.forEach(gull => {
    const u = gull.userData;
    const angle = t * u.speed + u.phase;
    const nx = u.centerX + Math.cos(angle) * u.radiusX;
    const nz = u.centerZ + Math.sin(angle) * u.radiusZ;
    const ny = u.height + Math.sin(t * 0.003 + u.phase) * 0.22;
    const dx = nx - gull.position.x;
    const dz = nz - gull.position.z;
    gull.position.set(nx, ny, nz);
    if (Math.hypot(dx, dz) > 0.0001) {
      gull.rotation.y = Math.atan2(dx, dz);
    }
    const flap = Math.sin(t * 0.012 + u.phase * 2) * 0.55;
    u.wingL.rotation.z = flap;
    u.wingR.rotation.z = -flap;
  });

  // 5. Whales Swimming & Surfacing with Water Spout
  whales.forEach(whale => {
    const u = whale.userData;
    const angle = t * u.speed + u.phase;
    const nx = Math.cos(angle) * u.rx;
    const nz = Math.sin(angle) * u.rz;
    const surfCycle = Math.sin(t * 0.0014 + u.phase);
    const ny = -0.68 + surfCycle * 0.22;
    const dx = nx - whale.position.x;
    const dz = nz - whale.position.z;
    whale.position.set(nx, ny, nz);
    if (Math.hypot(dx, dz) > 0.0001) {
      whale.rotation.y = Math.atan2(dx, dz);
    }
    u.tailPivot.rotation.x = Math.sin(t * 0.005 + u.phase) * 0.28;
    // Blowhole water spout active when whale surfaces near peak
    const spoutActive = surfCycle > 0.45;
    u.spoutGroup.visible = spoutActive;
    if (spoutActive) {
      const sScale = 0.6 + ((t * 0.004) % 0.8);
      u.spoutGroup.scale.set(1, sScale, 1);
    }
  });

  // 6. Dolphins Leaping in Parabolic Arcs
  dolphins.forEach(dWrap => {
    const u = dWrap.userData;
    const cycle = (t * u.speed + u.phase) % (Math.PI * 2);
    const s = Math.sin(cycle);
    if (s > 0) {
      // Airborne leap!
      u.dolphinMesh.visible = true;
      const progress = (cycle / Math.PI) - 0.5; // -0.5 to +0.5
      u.dolphinMesh.position.y = s * u.jumpHeight;
      u.dolphinMesh.position.z = progress * u.jumpSpanZ * 2;
      // Pitch nose tangent to arc
      u.dolphinMesh.rotation.x = -Math.cos(cycle) * 0.85;
      // Splash ring appears near water entry/exit
      if (s < 0.35) {
        u.splashRing.material.opacity = (0.35 - s) * 1.8;
        const rScale = 1 + (0.35 - s) * 2.5;
        u.splashRing.scale.set(rScale, rScale, 1);
        u.splashRing.position.z = u.dolphinMesh.position.z;
      } else {
        u.splashRing.material.opacity = 0;
      }
    } else {
      u.dolphinMesh.visible = false;
      u.splashRing.material.opacity = 0;
    }
  });

  // 7. Luxury Cruise Ship Sailing Grand Loop around Archipelago
  const cruiseAngle = t * 0.00018;
  const cx = Math.cos(cruiseAngle) * 19.5;
  const cz = Math.sin(cruiseAngle) * 6.8;
  const cdx = cx - cruiseShip.position.x;
  const cdz = cz - cruiseShip.position.z;
  cruiseShip.position.set(cx, -0.56 + Math.sin(t * 0.0025) * 0.03, cz);
  if (Math.hypot(cdx, cdz) > 0.0001) {
    cruiseShip.rotation.y = Math.atan2(cdx, cdz);
  }
  cruiseShip.rotation.z = Math.sin(t * 0.002) * 0.025;

  // 8. Explorer Sailboat Moving to Selected Island
  const bdx = boatTarget.x - boat.position.x;
  const bdz = boatTarget.z - boat.position.z;
  if (Math.hypot(bdx, bdz) > 0.02) {
    boat.position.x += bdx * 0.05;
    boat.position.z += bdz * 0.05;
    const targetAngle = Math.atan2(-bdz, bdx);
    boat.rotation.y = THREE.MathUtils.lerp(boat.rotation.y, targetAngle, 0.1);
  }
  boat.position.y = -0.48 + Math.sin(t * 0.004) * 0.04;
  boat.rotation.z = Math.sin(t * 0.003) * 0.06;

  // 9. Camera Follow or Focus
  if (followMode === 'cruise') {
    controls.target.lerp(cruiseShip.position, 0.06);
  } else if (followMode === 'whale') {
    controls.target.lerp(whales[0].position, 0.06);
  } else if (focusTarget) {
    controls.target.lerp(focusTarget, 0.08);
    // Offset camera slightly to the left when drawer is open on desktop so island is centered in the visible left area
    const xOffset = (drawerOpen && window.innerWidth > 760) ? 2.4 : 0;
    const camGoal = new THREE.Vector3(focusTarget.x + xOffset, focusTarget.y + 5.2, focusTarget.z + 7.2);
    camera.position.lerp(camGoal, 0.07);
    if (camera.position.distanceTo(camGoal) < 0.15) focusTarget = null;
  }

  if (autoTour) {
    autoTourTimer += 1;
    if (autoTourTimer > 380) {
      autoTourTimer = 0;
      selectIsland((selectedIsland + 1) % data.length, true, true);
    }
  }

  controls.update();
  updateMarkers();
  renderer.render(scene, camera);
}

function drawRadarChart(canvasEl, totals, maxScore = 12) {
  if (!canvasEl) return;
  const ctx = canvasEl.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = 240;
  canvasEl.width = size * dpr;
  canvasEl.height = size * dpr;
  canvasEl.style.width = `${size}px`;
  canvasEl.style.height = `${size}px`;
  ctx.scale(dpr, dpr);

  const cx = size / 2;
  const cy = size / 2;
  const radius = 76;
  const axes = [
    { key: 'humility', label: '謙卑感恩', angle: -Math.PI / 2 },
    { key: 'empathy', label: '同理關係', angle: 0 },
    { key: 'faith', label: '歸榮耀與神', angle: Math.PI / 2 },
    { key: 'awareness', label: '自我覺察', angle: Math.PI }
  ];

  ctx.clearRect(0, 0, size, size);

  for (let ring = 1; ring <= 4; ring++) {
    const r = (radius / 4) * ring;
    ctx.beginPath();
    axes.forEach((ax, i) => {
      const x = cx + Math.cos(ax.angle) * r;
      const y = cy + Math.sin(ax.angle) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = ring % 2 === 0 ? 'rgba(255,255,255,0.6)' : 'rgba(225,244,236,0.5)';
    ctx.fill();
    ctx.strokeStyle = '#bddcd2';
    ctx.stroke();
  }

  axes.forEach(ax => {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ax.angle) * radius, cy + Math.sin(ax.angle) * radius);
    ctx.strokeStyle = '#9ec8bb';
    ctx.stroke();
  });

  ctx.beginPath();
  axes.forEach((ax, i) => {
    const val = Math.min(maxScore, Math.max(1.5, totals[ax.key] || 0));
    const r = (val / maxScore) * radius;
    const x = cx + Math.cos(ax.angle) * r;
    const y = cy + Math.sin(ax.angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(45, 138, 120, 0.34)';
  ctx.fill();
  ctx.strokeStyle = '#247564';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  axes.forEach(ax => {
    const val = Math.min(maxScore, Math.max(1.5, totals[ax.key] || 0));
    const r = (val / maxScore) * radius;
    const x = cx + Math.cos(ax.angle) * r;
    const y = cy + Math.sin(ax.angle) * r;
    ctx.beginPath();
    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = '#e6ad45';
    ctx.fill();

    const lx = cx + Math.cos(ax.angle) * (radius + 26);
    const ly = cy + Math.sin(ax.angle) * (radius + 18);
    ctx.fillStyle = '#1f4252';
    ctx.font = 'bold 11.5px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${ax.label}(${totals[ax.key]})`, lx, ly);
  });
}

function makeGrowthCardData() {
  const choicesCount = chosen.filter(v => v !== null).length;
  const response = responseFeedback[storyState.response || 'pause'];
  const motive = motiveData[storyState.motive || 'share'];

  let title, avatar, desc;
  if (storyState.balloon >= 70 || storyState.response === 'revenge' || storyState.motive === 'applause') {
    title = '勇敢省察的旅人';
    avatar = '🌱';
    desc = '我正在學習不讓掌聲或一時的委屈替我做決定。我願意隨時停下來，重新做出合乎中道的選擇。';
  } else if (response.score >= 3 && motive.score >= 3 && storyState.balloon <= 35) {
    title = '謙卑發光的旅人';
    avatar = '🌟';
    desc = '我願意欣賞別人的優點、用愛心溫和說真話，並把領受的能力用來祝福人，把榮耀歸給上帝。';
  } else {
    title = '穩步成長的旅人';
    avatar = '🧭';
    desc = '我可以為自己的努力感到開心，也持續練習換位思考、檢視動機，讓每一個選擇更有愛與平安。';
  }

  const displayName = travelerName ? `${travelerName}｜${title}` : title;
  const stats = [
    `謙卑 ${storyState.balloon <= 35 ? '🌟 展現中' : '🌱 練習中'}`,
    `同理 ${response.score >= 2 ? '🌟 展現中' : '🌱 可加強'}`,
    `省察 ${motive.score >= 2 ? '🌟 展現中' : '🌱 練習中'}`,
    `歷程 ${choicesCount}/5 站`
  ];
  return { avatar, displayName, desc, stats, motto: travelerMotto };
}

function downloadCharacterPNG() {
  const info = makeGrowthCardData();
  const c = document.createElement('canvas');
  c.width = 900;
  c.height = 1160;
  const ctx = c.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 900, 1160);
  grad.addColorStop(0, '#d8f4e6');
  grad.addColorStop(0.55, '#e8ecff');
  grad.addColorStop(1, '#fff2d6');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(0, 0, 900, 1160, 48);
  ctx.fill();

  ctx.strokeStyle = '#b8dfd1';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.roundRect(24, 24, 852, 1112, 36);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255, 248, 220, 0.85)';
  ctx.beginPath();
  ctx.arc(450, 230, 125, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#387d6e';
  ctx.font = 'bold 24px "Noto Sans TC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('MY GROWTH CARD · 學習歷程群島角色卡', 450, 88);

  ctx.font = '110px sans-serif';
  ctx.fillText(info.avatar, 450, 265);

  ctx.fillStyle = '#1d4c43';
  ctx.font = 'bold 44px "Noto Sans TC", sans-serif';
  ctx.fillText(info.displayName, 450, 400);

  ctx.fillStyle = '#47626e';
  ctx.font = '26px "Noto Sans TC", sans-serif';
  const maxWidth = 700;
  let line = '';
  let y = 465;
  for (const ch of info.desc) {
    const testLine = line + ch;
    if (ctx.measureText(testLine).width > maxWidth) {
      ctx.fillText(line, 450, y);
      line = ch;
      y += 42;
    } else {
      line = testLine;
    }
  }
  if (line) ctx.fillText(line, 450, y);

  ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
  ctx.beginPath();
  ctx.roundRect(90, 565, 720, 340, 28);
  ctx.fill();

  ctx.textAlign = 'left';
  ctx.fillStyle = '#245249';
  ctx.font = 'bold 26px "Noto Sans TC", sans-serif';
  const detailLines = [
    `✦ 四向度狀態：${info.stats.join(' ｜ ')}`,
    `✦ 佩佩氣球狀態：膨脹度 ${storyState.balloon}%`,
    `✦ 阿德回應選擇：${storyState.response ? responseFeedback[storyState.response].title : '穿上軍裝先停下來'}`,
    `✦ 西門動機省察：${storyState.motive ? motiveData[storyState.motive].title : '願意分享與服事'}`,
    `✦ 群島探索紀錄：已踏足 ${visitedIslands.size}/6 座島嶼`
  ];
  detailLines.forEach((t, idx) => {
    ctx.fillText(t, 130, 628 + idx * 58);
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#26695b';
  ctx.font = 'bold 30px "Noto Sans TC", sans-serif';
  ctx.fillText(`「${info.motto}」`, 450, 995);

  ctx.fillStyle = '#6c858e';
  ctx.font = '22px "Noto Sans TC", sans-serif';
  ctx.fillText('羅馬書 12:3 — 不要看自己過於所當看的，要看得合乎中道', 450, 1065);

  c.toBlob(blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${travelerName || '我的'}成長角色卡.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    sfx.fanfare();
    toast('🖼️ 已下載高畫質 PNG 成長角色卡！');
  }, 'image/png');
}

function escapeXml(s) {
  return String(s).replace(/[<>&'"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;' }[c]));
}

function downloadCharacterSVG() {
  const info = makeGrowthCardData();
  const textLines = [
    '我的成長角色卡',
    info.displayName,
    info.desc,
    ...info.stats,
    `氣球狀態：${storyState.balloon}%`,
    `格言：「${info.motto}」`
  ];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff5e9"/><stop offset="1" stop-color="#e8e9ff"/></linearGradient></defs><rect width="900" height="1100" rx="48" fill="url(#bg)"/><circle cx="450" cy="210" r="130" fill="#fff6d9" opacity=".8"/><text x="450" y="90" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#588b7b" letter-spacing="5">MY GROWTH CARD</text><text x="450" y="255" text-anchor="middle" font-size="110">${info.avatar}</text><text x="450" y="360" text-anchor="middle" font-size="43" font-weight="bold" font-family="sans-serif" fill="#2b6256">${escapeXml(textLines[1])}</text><foreignObject x="100" y="405" width="700" height="150"><div xmlns="http://www.w3.org/1999/xhtml" style="font:26px/1.8 sans-serif;color:#526c75;text-align:center">${escapeXml(textLines[2])}</div></foreignObject>${textLines.slice(3).map((t, i) => `<text x="115" y="${600 + i * 56}" font-size="24" font-family="sans-serif" fill="#365b56">✦ ${escapeXml(t)}</text>`).join('')}<text x="450" y="1040" text-anchor="middle" font-size="24" font-family="sans-serif" fill="#588b7b">羅馬書 12:3 · 看得合乎中道</text></svg>`;
  const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${travelerName || '我的'}成長角色卡.svg`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  sfx.fanfare();
  toast('⬇ 已下載成長角色卡 SVG 向量檔！');
}

function renderDrawerContent() {
  updateDrawerHeader();
  if (activeDrawerTab === 'story') renderStoryTab();
  else if (activeDrawerTab === 'choice') renderChoiceTab();
  else renderLabTab();
}

function selectIsland(i, fly = true, openPanel = true, preferredTab = null) {
  followMode = null;
  selectedIsland = (i + data.length) % data.length;
  selectedRoomIdx = 0;
  if (preferredTab) activeDrawerTab = preferredTab;
  visitedIslands.add(selectedIsland);
  drawerOpen = openPanel;
  drawerEl.classList.toggle('open', drawerOpen);

  saveJourney();
  getEarnedBadgesInfo();
  refreshIslandScalesAndMarkers();
  renderIslandDock();
  if (drawerOpen) renderDrawerContent();

  const pos = islandGroups[selectedIsland].position;
  const s = islandGroups[selectedIsland].userData.targetScale || 1;
  boatTarget.set(pos.x, -0.48, pos.z + 2.3 * s);

  if (fly) {
    sfx.islandSelect(selectedIsland);
    focusTarget = islandGroups[selectedIsland].getWorldPosition(new THREE.Vector3());
  }
}

document.querySelectorAll('.drawer-tab').forEach(btn => {

document.querySelector('#auto-tour').addEventListener('click', (e) => {

  roomNotes = {};

});

// Raycasting on 3D Islands, Cruise Ship & Whales
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = { x: 0, y: 0 };

canvas.addEventListener('pointerdown', e => {
  downPos = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('pointermove', e => {
  if (e.buttons) return;
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  canvas.style.cursor = hits.length ? 'pointer' : 'grab';
});

canvas.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 8) return;
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  if (!hits.length) return;
  const obj = hits[0].object;
  if (obj.userData.wildlifeType === 'cruise') {
    sfx.horn();
    followMode = 'cruise';
    toast('🛳️ 嗚——！豪華郵輪向你鳴笛致意！');
  } else if (obj.userData.wildlifeType === 'whale') {
    sfx.inflate();
    followMode = 'whale';
    toast('🐋 藍鯨噴出高高的水柱向你打招呼！');
  } else if (obj.userData.index !== undefined) {
    selectIsland(obj.userData.index, true, true);
  }
});

loadJourney();
